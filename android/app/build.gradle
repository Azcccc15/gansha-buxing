plugins { id 'com.android.application' }

def signingFile = rootProject.file('signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.ganshabuxing.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ganshabuxing.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
}

tasks.register('syncWebAssets', Copy) {
    from('../../api/public') { exclude 'index.html' }
    into('src/main/assets/web')
}
tasks.register('syncAiPrompt', Copy) {
    from('../../api/src/system-prompt.txt')
    into('src/main/assets')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets', 'syncAiPrompt' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
